name: Phase 1 measured-count refresh

on:
  push:
    branches:
      - phase1-ux-operator-console

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-ux-operator-console
          fetch-depth: 0

      - name: Apply only measured strict-suite counts
        shell: bash
        run: |
          set -euo pipefail
          grep -F '| foundation | 3 | 157 | PASS | PASS |' docs/CONFORMANCE_MATRIX.md
          grep -F '| **TOTAL** | **58** | **3323** | **0 failing, 0 skipped** | **0 failing, 0 skipped** |' docs/CONFORMANCE_MATRIX.md
          grep -F 'Expect **3323 passing, 0 failing, 0 skipped**' docs/DEPLOYMENT_RUNBOOK.md

          sed -i 's/| foundation | 3 | 157 | PASS | PASS |/| foundation | 3 | 159 | PASS | PASS |/' docs/CONFORMANCE_MATRIX.md
          sed -i 's/| \*\*TOTAL\*\* | \*\*58\*\* | \*\*3323\*\* |/| **TOTAL** | **58** | **3325** |/' docs/CONFORMANCE_MATRIX.md
          sed -i 's/Expect \*\*3323 passing, 0 failing, 0 skipped\*\*/Expect **3325 passing, 0 failing, 0 skipped**/' docs/DEPLOYMENT_RUNBOOK.md

          grep -F '| foundation | 3 | 159 | PASS | PASS |' docs/CONFORMANCE_MATRIX.md
          grep -F '| **TOTAL** | **58** | **3325** | **0 failing, 0 skipped** | **0 failing, 0 skipped** |' docs/CONFORMANCE_MATRIX.md
          grep -F 'Expect **3325 passing, 0 failing, 0 skipped**' docs/DEPLOYMENT_RUNBOOK.md
          ! grep -Fq '3323' docs/CONFORMANCE_MATRIX.md
          ! grep -Fq '3323' docs/DEPLOYMENT_RUNBOOK.md

      - name: Commit measured-count documentation refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONFORMANCE_MATRIX.md docs/DEPLOYMENT_RUNBOOK.md
          git diff --cached --quiet && { echo 'No documentation count changes found'; exit 1; }
          git diff --cached --name-only | grep -Fx 'docs/CONFORMANCE_MATRIX.md'
          git diff --cached --name-only | grep -Fx 'docs/DEPLOYMENT_RUNBOOK.md'
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "Refresh measured Phase 1 strict-suite counts"
          git push origin HEAD:phase1-ux-operator-console
