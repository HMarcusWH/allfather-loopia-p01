name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the SAME PULL REQUEST supersedes an in-flight run for it, because a run against
# code that has been replaced tells nobody anything. Everything else — a push to `main` above all —
# groups by its OWN commit SHA, so no qualification run for a commit that is already on a branch can
# be cancelled or queued out by a later one. A merged release keeps its own complete run, and the
# audit trail of what was qualified survives a burst of merges.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number
        && format('pr-{0}', github.event.pull_request.number)
        || format('sha-{0}', github.sha)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ONE PROCEDURE, TWO ROUTES. Every `run:` below that decides qualification is
# `bash ops/ci/qualify-release.sh step <name>`, and the step bodies live in that runner rather than
# here. `bash ops/ci/qualify-release.sh local` executes the SAME steps, in the SAME order, from a
# `git archive` export of one exact commit — the route used while hosted runners are unavailable.
# `tests/foundation/qualification_runner_boundary.php` fails the build if this file, the runner and
# `ReleaseQualification::CODE_JOBS` disagree. What stays here is provisioning only: checkout, toolchains,
# the database service, its connection file, and moving artifacts between hosted jobs.
jobs:
  # Cheap, no-database checks. Runs first so an authority-boundary regression fails fast.
  foundation:
    runs-on: ubuntu-latest
    # Measured ~35s with a warm npm cache. Ten minutes absorbs a cold cache and a slow runner
    # start without letting a genuinely hung job burn the 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up exact frontend Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: 'frontend/console/.node-version'
          cache: 'npm'
          cache-dependency-path: 'frontend/console/package-lock.json'

      - name: Frontend clean install, tests, production build and public staging
        run: bash ops/ci/qualify-release.sh step frontend

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, openssl, mbstring, json
          coverage: none

      - name: Show runtime
        run: bash ops/ci/qualify-release.sh step runtime

      - name: Validate the upstream lock
        run: bash ops/ci/qualify-release.sh step lock

      # Fails loudly on a missing directory: the served tree was once not linted at all because a
      # renamed path only produced a warning.
      - name: PHP syntax
        run: bash ops/ci/qualify-release.sh step php-syntax

      # The authority boundary and the no-external-action structural proof. These need no database
      # and must never be skipped. The generated public asset subtree exists in this job because
      # staging ran above; the same tests also pass in DB jobs where generated assets are absent.
      - name: Foundation invariants
        run: bash ops/ci/qualify-release.sh step foundation-layer

      - name: Unit tests
        run: bash ops/ci/qualify-release.sh step unit-layer

  # The layers that make a MariaDB parity claim. A result obtained against SQLite would not be a
  # MariaDB parity claim, so this job provides a REAL MariaDB and runs --strict: a skipped
  # database-backed test fails the build rather than quietly passing it.
  #
  # BOTH VERSIONS THAT MATTER, as a matrix rather than two copied jobs — two copies drift, and the
  # one that drifts is the one nobody reads. 10.6 is Loopia Företag's actual floor; 10.11 is
  # Företag Plus. Proving only 10.11 would be proving the tier the customer may not be on.
  mariadb:
    name: mariadb ${{ matrix.mariadb }}
    runs-on: ubuntu-latest
    # Measured ~105s including service-container startup and the full strict suite.
    timeout-minutes: 15
    strategy:
      # Both versions always run. Failing fast here would hide whether a failure is version-specific,
      # which is the single most useful thing this matrix can tell us.
      fail-fast: false
      matrix:
        mariadb: ['10.6', '10.11']
    env:
      QUALIFY_LANE: ${{ matrix.mariadb }}
      QUALIFY_ENV_FILE: .env.testing
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: ci_root
          MARIADB_DATABASE: allfather_test
          MARIADB_USER: allfather
          MARIADB_PASSWORD: allfather_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, openssl, mbstring, json
          coverage: none

      # Provisioning: the connection file for THIS job's service container. A local run names its
      # own lane databases instead, one --env-<lane> file each.
      - name: Write the test environment
        run: |
          cat > .env.testing <<'ENVEOF'
          APP_ENV=testing
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=allfather_test
          DB_USER=allfather
          DB_PASSWORD=allfather_ci
          ENVEOF

      # The version is RECORDED from the server, not assumed from the matrix key: a job that
      # reported the version it asked for rather than the one it got could claim 10.6 parity while
      # running on anything.
      - name: Record the MariaDB version under test
        run: bash ops/ci/qualify-release.sh step db-version

      # A clean install: every migration applied to the empty service database.
      - name: Apply migrations
        run: bash ops/ci/qualify-release.sh step migrate

      # Applying a second time must be a clean no-op, and must report no drift: a migration edited
      # after being applied means the database and the repository disagree about the schema.
      - name: Migrations are idempotent and undrifted
        run: bash ops/ci/qualify-release.sh step migrate-repeat

      - name: Migration status
        run: bash ops/ci/qualify-release.sh step migrate-status

      # LOOPIA_PROBE_001, non-network by default. On a healthy runner this produces
      # `staging_host_verdict: READY` and `live_read_host_verdict: NOT_QUALIFIED` — the second
      # because nothing was demonstrated. `--allow-network` is deliberately NOT passed: CI must not
      # make an outbound request nobody asked for, and a READY live-read verdict obtained here would
      # say nothing about Loopia anyway.
      - name: Host capability probe
        run: bash ops/ci/qualify-release.sh step probe

      - name: Deployment evidence registry
        run: bash ops/ci/qualify-release.sh step evidence

      # The WHOLE suite in one step, deliberately, rather than a step per layer: a layer whose tests
      # exist but whose step was never added would be green by omission. `--strict` makes a SKIP a
      # build failure, and `--report-json` writes the sanitized qualification report alongside the
      # unchanged human output — counts and the versions READ BACK from the connection used, never
      # a credential, a DSN, a fixture or an assertion message.
      - name: Full suite against real MariaDB
        run: bash ops/ci/qualify-release.sh step full-suite

      # UPLOADED EVEN WHEN THE SUITE FAILED — the run whose report matters most is the one that did.
      #
      # NAMED FOR WHAT IT IS. This is a GitHub-hosted runner: it qualifies the CODE and has never
      # touched Loopia. It is not host proof, and `docs/DEPLOYMENT_EVIDENCE_MODEL.md` §4.2 is why
      # such a record can only ever be filed with `environment: "ci"`, which supports no host claim.
      - name: Upload CI qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-mariadb-${{ matrix.mariadb }}
          path: |
            qualification-${{ matrix.mariadb }}.json
            probe-${{ matrix.mariadb }}.json
          if-no-files-found: warn
          retention-days: 30

  # THE DEPLOYMENT PATH, EXECUTED RATHER THAN READ.
  #
  # `tests/foundation/release_packaging_boundary.php` and `tests/security/release_preflight_safety.php`
  # assert things about the SOURCE TEXT of `prepare-release.sh` and `preflight.php`. That is worth
  # having, and it is not the same as knowing the commands run. So this job executes the one path a
  # deployment actually depends on — export the exact Git object, enforce the toolchain pins, build,
  # stage, compare bytes and rehearse the root sync. Inert readiness is evaluated separately.
  #
  # THIS CHECKS PACKAGE INTEGRITY, NOT RELEASE AUTHORITY; IT DOES NOT DEPLOY. There is no ssh, no remote host, no Loopia credential and no
  # evidence record here. The rsync rehearsal targets a directory in the runner's temp space and
  # dies with the runner; preflight opens no database connection.
  package-integrity:
    name: package integrity
    runs-on: ubuntu-latest
    # Measured ~90s locally for npm ci + tests + build + stage + preflight.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the repository-pinned frontend Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: 'frontend/console/.node-version'
          cache: 'npm'
          cache-dependency-path: 'frontend/console/package-lock.json'

      - name: The repository-pinned npm must be the npm in use
        run: bash ops/ci/qualify-release.sh step npm-pin

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, openssl, mbstring, json
          coverage: none

      # THE EXACT CHECKED-OUT COMMIT, read back from git. On a pull_request event the checkout is
      # the merge commit, and that IS the tree being qualified.
      - name: Prepare a release from the exact checked-out commit
        run: bash ops/ci/qualify-release.sh step prepare

      - name: The prepared release must report this commit and a resolvable manifest
        run: bash ops/ci/qualify-release.sh step verify-prepared

      - name: The prepared release must be byte-identical to the named Git object
        run: bash ops/ci/qualify-release.sh step verify-export

      - name: Root rsync preserves host state and deploys qualification inputs
        run: bash ops/ci/qualify-release.sh step rsync-rehearsal

      # Code/profile qualification stops before deployment-readiness authorization.
      # A separate manual workflow invokes the unchanged fail-closed inert preflight.
      - name: Upload the prepared-release reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-integrity
          path: ${{ runner.temp }}/qualification/prepare-release.verdict.json
          if-no-files-found: warn
          retention-days: 30

  # The single gate. It exists because "every job is green" is a thing a human reads off a page and
  # a required status check is a thing a branch protection can enforce — and because a job that is
  # SKIPPED renders as neutral, which some protections treat as passing. This one runs `always()`
  # and fails explicitly, so a skipped dependency is a red check rather than an absent one.
  #
  # It does not trust the job results alone: it re-reads the uploaded reports and asserts what they
  # actually say, then writes a distinct CODE_QUALIFICATION_RECEIPT — marked GITHUB_ACTIONS, naming
  # this run, and self-reported like every receipt.
  #
  # IT INTRODUCES NO DEPLOYMENT. There is no Loopia secret in this workflow, nothing is copied
  # anywhere, and passing this check authorizes nothing — see docs/CLAIM_CEILING.md.
  code-qualification:
    name: code qualification
    runs-on: ubuntu-latest
    # Measured ~5s before checkout and PHP were added; the budget absorbs both.
    timeout-minutes: 5
    needs: [foundation, mariadb, package-integrity]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, openssl, mbstring, json
          coverage: none

      - name: Collect the qualification reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qualification-mariadb-*
          path: reports

      - name: Collect the prepared-release reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-integrity
          path: prepared

      # EVERY required job, checked the same way, with each result PRINTED. `success` is the only
      # value that passes: `failure`, `cancelled` and `skipped` all fail, and a skipped job matters
      # most — it renders as neutral, which some branch protections treat as passing. This is the
      # hosted counterpart of a local run's per-step exit codes, and the one check that can only
      # exist here: it reads GitHub's own job results.
      - name: Every code qualification job must have succeeded
        run: |
          set -euo pipefail
          foundation='${{ needs.foundation.result }}'
          mariadb='${{ needs.mariadb.result }}'
          package_integrity='${{ needs.package-integrity.result }}'
          echo "foundation:          ${foundation}"
          echo "mariadb:             ${mariadb}"
          echo "package integrity: ${package_integrity}"
          blocked=0
          for result in "$foundation" "$mariadb" "$package_integrity"; do
            if [ "$result" != "success" ]; then
              blocked=1
            fi
          done
          if [ "$blocked" -ne 0 ]; then
            echo "code qualification NOT met: a required job did not succeed" >&2
            exit 1
          fi

      # The reports are read rather than believed. Each must be a COMPLETE strict run — no layer
      # filter, no file filter — with zero failures and zero skips, and together they must cover the
      # 10.6 and 10.11 lines exactly once each.
      - name: The reports must say what the jobs claimed
        id: lanes
        run: bash ops/ci/qualify-release.sh step verify-lanes

      - name: Write the code qualification receipt
        if: always()
        env:
          QUALIFY_NEEDS_FOUNDATION: ${{ needs.foundation.result }}
          QUALIFY_NEEDS_MARIADB: ${{ needs.mariadb.result }}
          QUALIFY_NEEDS_PACKAGE: ${{ needs.package-integrity.result }}
          QUALIFY_VERIFY_LANES_OUTCOME: ${{ steps.lanes.outcome }}
          QUALIFY_PACKAGE_REPORT: prepared/prepare-release.verdict.json
        run: bash ops/ci/qualify-release.sh code-ci-receipt

      - name: Upload the code qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-qualification-receipt
          path: ${{ runner.temp }}/qualification/code-qualification-receipt.json
          if-no-files-found: warn
          retention-days: 30
