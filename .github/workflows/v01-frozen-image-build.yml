name: V01 PHP85 Dockerfile DOM repair candidate (NO DEPLOY)

on:
  push:
    branches:
      - verification/v01-frozen-image-build-20261030

permissions:
  contents: read

jobs:
  build-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact frozen source without repository credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 18457c305f93ccee0875fadbd738d2ae017cff2d
          persist-credentials: false
          path: frozen
          fetch-depth: 1

      - name: Verify exact frozen SHA and tree before image build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen rev-parse HEAD)" = "18457c305f93ccee0875fadbd738d2ae017cff2d"
          test "$(git -C frozen rev-parse 'HEAD^{tree}')" = "0a8ac9ad77894a1699a8f79f93f26e88249f9662"
          test -z "$(git -C frozen status --porcelain --untracked-files=no)"
          test "$(cat frozen/frontend/console/.node-version)" = "22.16.0"
          test -f frozen/docs/BUILD_FREEZE_MANIFEST.json

      - name: Probe official PHP 8.5 base DOM before any patch
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint php \
            php:8.5.12-apache-bookworm \
            -r 'echo "base=",PHP_VERSION," dom=",extension_loaded("dom")?"yes":"no",
               " html5=",class_exists("Dom\\HTMLDocument")?"yes":"no","\\n";
               if (!extension_loaded("dom") || !class_exists("Dom\\HTMLDocument")) exit(3);'

      - name: Prepare one-line Dockerfile correction outside frozen checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib
          source=pathlib.Path("frozen/Dockerfile")
          text=source.read_text(encoding="utf-8")
          before='docker-php-ext-install -j"$(nproc)" pdo_mysql mbstring curl dom'
          after='docker-php-ext-install -j"$(nproc)" pdo_mysql mbstring curl'
          if text.count(before)!=1:
              raise RuntimeError("V01_DOCKERFILE_PATCH_EXPECTED_ONE_EXACT_LINE")
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/"Dockerfile.v01-lexbor-avoidance"
          output.write_text(text.replace(before,after),encoding="utf-8")
          print("V01_DOCKERFILE_OVERLAY_ONLY_OMITS_REDUNDANT_DOM_REBUILD")
          PY
          test -z "$(git -C frozen status --porcelain --untracked-files=no)"

      - name: Build disposable candidate image with uncommitted Dockerfile overlay
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --progress=plain \
            --file "$RUNNER_TEMP/Dockerfile.v01-lexbor-avoidance" \
            --tag allfather-v01-frozen:18457c305f93 \
            frozen

      - name: Inspect PHP 8.5 runtime and exact source identity with networking disabled
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v01-image"
          image_id="$(docker image inspect --format '{{ .Id }}' allfather-v01-frozen:18457c305f93)"
          test -n "$image_id"
          php_version="$(docker run --rm --network none --entrypoint php \
            allfather-v01-frozen:18457c305f93 -r 'echo PHP_VERSION;')"
          test "$php_version" = "8.5.12"
          docker run --rm --network none --entrypoint php \
            allfather-v01-frozen:18457c305f93 \
            -r 'if (!class_exists("Dom\\HTMLDocument")) exit(2);
                foreach (["pdo","pdo_mysql","curl","openssl","json","mbstring","hash","dom"] as $ext) {
                    if (!extension_loaded($ext)) exit(3);
                }
                if (!is_dir("/srv/allfather/public_html/assets/operator-console")) exit(4);
                if (!is_file("/srv/allfather/docs/BUILD_FREEZE_MANIFEST.json")) exit(5);
                echo "V01_PHP85_IMAGE_PREPARED_INERT_NO_RUNTIME_SERVICE\n";'
          frozen_manifest="$(sha256sum frozen/docs/BUILD_FREEZE_MANIFEST.json | cut -d' ' -f1)"
          built_manifest="$(docker run --rm --network none --entrypoint php \
            allfather-v01-frozen:18457c305f93 \
            -r 'echo hash_file("sha256","/srv/allfather/docs/BUILD_FREEZE_MANIFEST.json");')"
          test "$frozen_manifest" = "$built_manifest"
          IMAGE_ID="$image_id" PHP_VERSION="$php_version" MANIFEST_HASH="$built_manifest" \
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"v01-image"
          result={
              "version":"v01.frozen-source-container-build-receipt.v1",
              "state":"CANDIDATE_DOCKERFILE_OVERLAY_BUILT_NOT_DEPLOYED",
              "git_commit":"18457c305f93ccee0875fadbd738d2ae017cff2d",
              "git_tree":"0a8ac9ad77894a1699a8f79f93f26e88249f9662",
              "declared_frontend_node":"22.16.0",
              "declared_npm":"10.9.2",
              "actual_php_version":os.environ["PHP_VERSION"],
              "php_required_extensions":"CHECKED_PRESENT_IN_NONNETWORKED_CONTAINER",
              "native_html5_dom_document":"CHECKED_PRESENT_IN_NONNETWORKED_CONTAINER",
              "console_assets_built":"CHECKED_DIRECTORY_PRESENT",
              "built_manifest_sha256":os.environ["MANIFEST_HASH"],
              "image_id":os.environ["IMAGE_ID"],
              "entrypoint_executed":False,
              "network_access_inside_runtime_inspection":False,
              "application_deployed":False,
              "railway_service_modified":False,
              "live_database_touched":False,
              "source_or_model_provider_called":False,
              "owner_permission_admitted":False,
              "customer_visibility_authorized":False,
              "staging_host_verified":False,
              "unmodified_frozen_Dockerfile_built":False,
              "temporary_Dockerfile_dom_rebuild_removed":True,
              "source_refreeze_required_before_V01_host_acceptance":True,
              "v01_formal_host_gate":"NOT_VERIFIED_NO_GO"
          }
          (root/"v01-frozen-image-build-receipt.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(result,sort_keys=True))
          PY

      - name: Upload bounded runtime inspection receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v01-frozen-php85-image-build-18457c305f93
          path: ${{ runner.temp }}/v01-image/v01-frozen-image-build-receipt.json
          if-no-files-found: warn
          retention-days: 21
